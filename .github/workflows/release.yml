name: Publish beta release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate version tag and module manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("module.json").read_text(encoding="utf-8"))
          version = manifest["version"]
          tag = f"v{version}"
          repository = os.environ["GITHUB_REPOSITORY"]

          expected_manifest = (
              f"https://raw.githubusercontent.com/{repository}/main/module.json"
          )
          expected_zip = f"settlement-core-{tag}.zip"
          expected_download = (
              f"https://github.com/{repository}/releases/download/{tag}/{expected_zip}"
          )
          assert manifest.get("manifest") == expected_manifest, (
              f"Unexpected manifest URL: {manifest.get('manifest')!r}"
          )
          assert manifest.get("download") == expected_download, (
              f"Unexpected download URL: {manifest.get('download')!r}"
          )

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"RELEASE_TAG={tag}\n")
              env.write(f"RELEASE_ZIP={expected_zip}\n")
          PY

      - name: Build installable Foundry ZIP
        shell: bash
        run: |
          zip -q -r "$RELEASE_ZIP" module.json README.md LICENSE scripts lang
          unzip -t "$RELEASE_ZIP"
          test "$(unzip -Z1 "$RELEASE_ZIP" | head -n 1)" = "module.json"
          unzip -p "$RELEASE_ZIP" module.json > /tmp/packaged-module.json
          cmp module.json /tmp/packaged-module.json

      - name: Create beta release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG beta" \
              --notes "Settlement Core v0.3.3 fixes the runtime API version so dependent modules see the installed manifest version instead of a stale hard-coded 0.3.0. Automatic updates continue through the permanent main-branch manifest. Includes module.json and an installable Foundry VTT module ZIP." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

      - name: Upload ZIP and module.json as separate release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" "$RELEASE_ZIP" module.json --clobber

      - name: Bridge older installed manifests to the stable update channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
          while read -r OLD_TAG; do
            if [ -n "$OLD_TAG" ] && [ "$OLD_TAG" != "$RELEASE_TAG" ]; then
              gh release upload "$OLD_TAG" module.json --clobber
            fi
          done

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
            tee /tmp/release-assets.txt
          grep -Fx "module.json" /tmp/release-assets.txt
          grep -Fx "$RELEASE_ZIP" /tmp/release-assets.txt
